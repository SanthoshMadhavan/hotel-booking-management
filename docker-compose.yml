services:

  mysql:
    image: mysql:8.0
    container_name: hotel-mysql
    environment:
      MYSQL_DATABASE: hotel_booking_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  app:
    image: hotel-booking-management:latest
    container_name: hotel-booking-app
    ports:
      - "8080:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - mysql

volumes:
  mysql_data: